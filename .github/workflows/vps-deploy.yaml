name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA for deploy'
        required: true
        type: string

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        # Set environment variables in github actions secrets.
        # See .env.example for more details.
        env:
          DEVELOPMENT: ${{ secrets.DEVELOPMENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PORT: ${{ secrets.PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: DEVELOPMENT,DATABASE_URL,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,PORT
          script: |
            set -euo pipefail

            echo "🚀 Deploying commit: ${{ github.event.inputs.commit_sha }}"

            REPO_URL="https://github.com/${{ github.repository }}.git"
            TARGET_SHA="${{ github.event.inputs.commit_sha }}"
            PROJECT_DIR="${HOME}/projects/${{ secrets.PROJECT_NAME }}"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "📦 First deploy detected. Initializing repository..."
              mkdir -p "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              git init
              git remote add origin "$REPO_URL"
            else
              echo "🔄 Existing deploy detected. Updating repository..."
              cd "$PROJECT_DIR"
            fi

            git fetch --depth 1 --prune origin "$TARGET_SHA"
            git checkout --force FETCH_HEAD

            # Ensure required secrets are present.
            : "${DATABASE_URL:?DATABASE_URL secret is required}"
            : "${POSTGRES_DB:?POSTGRES_DB secret is required}"
            : "${POSTGRES_USER:?POSTGRES_USER secret is required}"
            : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is required}"

            # Build .env on VPS from GitHub Secrets for this deployment.
            {
              printf 'DEVELOPMENT=%s\n' "${DEVELOPMENT}"
              printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
              printf 'POSTGRES_DB=%s\n' "${POSTGRES_DB}"
              printf 'POSTGRES_USER=%s\n' "${POSTGRES_USER}"
              printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD}"
              printf 'PORT=%s\n' "${PORT}"
            } > .env

            echo "🔨 Running deploy.sh..."
            ./deploy.sh
