name: VPS Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA for deploy'
        required: true
        type: string

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        # Set environment variables in github actions secrets.
        # See .env.example for more details.
        env:
          DEVELOPMENT: ${{ secrets.DEVELOPMENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          MINIO_BROWSER_REDIRECT_URL: ${{ secrets.MINIO_BROWSER_REDIRECT_URL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          PORT: ${{ secrets.PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: DEVELOPMENT,DATABASE_URL,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,S3_PUBLIC_URL,S3_REGION,MINIO_BROWSER_REDIRECT_URL,S3_ENDPOINT_URL,S3_ACCESS_KEY,S3_SECRET_KEY,S3_BUCKET,PORT,TIMEZONE,VITE_HTML_LANG,SECRET_KEY,ADMIN_USERNAME,ADMIN_PASSWORD_HASH,ADMIN_TITLE,SESSION_MAX_AGE,SESSION_REMEMBER_ME_MAX_AGE
          script: |
            set -euo pipefail

            echo "🚀 Deploying commit: ${{ github.event.inputs.commit_sha }}"

            REPO_URL="https://github.com/${{ github.repository }}.git"
            TARGET_SHA="${{ github.event.inputs.commit_sha }}"
            PROJECT_DIR="${HOME}/projects/${{ secrets.PROJECT_NAME }}"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "📦 First deploy detected. Initializing repository..."
              mkdir -p "$PROJECT_DIR"
              cd "$PROJECT_DIR"
              git init
              git remote add origin "$REPO_URL"
            else
              echo "🔄 Existing deploy detected. Updating repository..."
              cd "$PROJECT_DIR"
            fi

            git fetch --depth 1 --prune origin "$TARGET_SHA"
            git checkout --force FETCH_HEAD

            # Ensure required secrets are present.
            : "${DATABASE_URL:?DATABASE_URL secret is required}"
            : "${POSTGRES_DB:?POSTGRES_DB secret is required}"
            : "${POSTGRES_USER:?POSTGRES_USER secret is required}"
            : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is required}"
            : "${S3_PUBLIC_URL:?S3_PUBLIC_URL secret is required}"
            : "${MINIO_BROWSER_REDIRECT_URL:?MINIO_BROWSER_REDIRECT_URL secret is required}"
            : "${S3_ACCESS_KEY:?S3_ACCESS_KEY secret is required}"
            : "${S3_SECRET_KEY:?S3_SECRET_KEY secret is required}"
            : "${S3_BUCKET:?S3_BUCKET secret is required}"
            : "${SECRET_KEY:?SECRET_KEY secret is required}"
            : "${ADMIN_USERNAME:?ADMIN_USERNAME secret is required}"
            : "${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH secret is required}"

            # Build .env on VPS from GitHub Secrets for this deployment.
            {
              printf 'DEVELOPMENT=%s\n' "${DEVELOPMENT}"
              printf 'DATABASE_URL=%s\n' "${DATABASE_URL}"
              printf 'POSTGRES_DB=%s\n' "${POSTGRES_DB}"
              printf 'POSTGRES_USER=%s\n' "${POSTGRES_USER}"
              printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD}"
              printf 'S3_PUBLIC_URL=%s\n' "${S3_PUBLIC_URL}"
              # Optional: skip when empty so the backend default (ru-central1) applies.
              if [ -n "${S3_REGION:-}" ]; then
                printf 'S3_REGION=%s\n' "${S3_REGION}"
              fi
              printf 'MINIO_BROWSER_REDIRECT_URL=%s\n' "${MINIO_BROWSER_REDIRECT_URL}"
              # Optional: skip when empty so the backend default (http://minio:9000) applies.
              if [ -n "${S3_ENDPOINT_URL:-}" ]; then
                printf 'S3_ENDPOINT_URL=%s\n' "${S3_ENDPOINT_URL}"
              fi
              printf 'S3_ACCESS_KEY=%s\n' "${S3_ACCESS_KEY}"
              printf 'S3_SECRET_KEY=%s\n' "${S3_SECRET_KEY}"
              printf 'S3_BUCKET=%s\n' "${S3_BUCKET}"
              printf 'PORT=%s\n' "${PORT}"
              printf 'SECRET_KEY=%s\n' "${SECRET_KEY}"
              printf 'ADMIN_USERNAME=%s\n' "${ADMIN_USERNAME}"
              # Compose treats $ in .env as interpolation. Escape so the bcrypt hash survives.
              printf 'ADMIN_PASSWORD_HASH=%s\n' "$(printf '%s' "${ADMIN_PASSWORD_HASH}" | sed 's/\$/$$/g')"
            } > .env

            echo "🔨 Running deploy.sh..."
            ./deploy.sh
