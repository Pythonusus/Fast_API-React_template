# ------------------------------------------------------------------------------
# ENVIRONMENT VARIABLES IN THIS COMPOSE FILE (READ THIS ONCE, FUTURE ME)
#
# 1) PARSE-TIME (when `docker compose` reads this YAML):
#    - `${VAR}` and `${VAR:-default}` are resolved by Compose before containers start.
#    - Sources for that resolution are:
#      a) shell environment variables from your terminal session
#      b) project `.env` file in the compose project directory (default behavior)
#         so all variables in project root `.env` file are available during parse-time.
#      c) `--env-file <file>` if explicitly passed to docker compose command
#    Compose does not pass these variables to the container automatically,
#    not during images build time (Dockerfile does not get these variables),
#    nor during container runtime (you need to pass them explicitly to the service).
#
# 2) RUNTIME (inside each running container):
#    - `env_file: .env` injects vars from `.env` into container environment.
#    - `environment:` sets/overrides vars in container environment.
#
# 3) PRECEDENCE (important):
#    - For `${...}` interpolation: shell env usually wins over `.env`.
#    - Inside containers: `environment:` entries win over `env_file` entries.
#
# 4) WHY BOTH `env_file` AND `${...}` ARE USED:
#    - `${...}` gives defaults and allows compose-level config (ports/names/etc).
#    - `env_file` makes vars available to app processes at runtime.
#
# 5) FRONTEND VITE_* AT IMAGE BUILD:
#    - Vite inlines VITE_* into the JS bundle at `docker build` time, not at container start.
#    - `env_file` on the frontend service is too late for that.
#    - Instead: top-level `secrets.root_env` (host `.env`) + `build.secrets` mounts it
#      into Dockerfile.frontend, which greps every `VITE_*` line for Vite. No per-key ARGs.
# ------------------------------------------------------------------------------
services:
  db:
    image: postgres:17-alpine

    # Uncomment this to set a custom container name.
    # Otherwise Compose auto-generates: <project-name>-<service-name>-<index>
    # Example: fast-api-react-template-db-1
    # Be careful, fixed container name can cause collision if you run multiple instances
    # of the same service.
    # container_name: db-container-name

    # runtime injection: vars from .env become available inside container process env
    # not available during parse-time
    # .env file is required, otherwise deploy/compose run will fail
    env_file:
      - .env

    # service listens on this port inside the docker network
    # does not expose the port to the host machine
    expose:
      - "5432"

    # Volumes are used to persist data on host machine.
    # syntax: host_path:in_container_path
    # Linux default host path is usually /var/lib/docker/volumes/<volume-name>/_data
    # Docker Compose prefixes <volume-name> with the dir name, where compose file is located.
    # So different apps get isolated volumes.
    # For this template final volume host path on linux machine is:
    # /var/lib/docker/volumes/fast-api-react-template-postgres_data/_data
    volumes:
      - postgres_data:/var/lib/postgresql/data  # named volume for host -> Postgres data dir in container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

    # Will restart container on any failures, unless it is stopped manually
    restart: unless-stopped

    # Logging configuration for db service
    # Without this block Docker uses default settings:
    #   - logs are stored indefinitely
    #   - log files can fill up the disk
    logging:
      # Keep logs in JSON format
      # They are stored on host in /var/lib/docker/containers/<container-id>
      driver: "json-file"

      options:
        # Maximum size of one log file
        max-size: "10m"
        # Maximum number of log files
        max-file: "3"


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    # container_name: backend-container-name

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

    # runtime injection: vars from .env become available inside container process env
    # .env file is required, otherwise deploy/compose run will fail
    env_file:
      - .env

    # service listens on this port inside the docker network
    # does not expose the port to the host machine
    expose:
      - "8080"

    # healthcheck is set in the Dockerfile.backend

    restart: unless-stopped

    logging:
      driver: "json-file"

      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Build-time only: root `.env` is mounted as a secret inside Dockerfile.frontend.
      # The Dockerfile greps VITE_* into Vite's envDir — new VITE_* keys need no compose edits.
      # Read from the host path (not build context), so `.dockerignore` excluding `.env` is fine.
      secrets:
        - root_env

    # container_name: frontend-container-name

    # runtime injection: vars from .env become available inside container process env
    # .env file is required, otherwise deploy/compose run will fail
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

    # service listens on this port inside the docker network
    # does not expose the port to the host machine
    expose:
      - "8080"
    ports:
      # parse-time interpolation: resolved by Compose before container is created
      # `${PORT:-8100}` here configures host port mapping at compose parse-time.
      # left side is host port, right side is container port
      - "${PORT:-8100}:8080"

    # healthcheck is set in the Dockerfile.frontend

    restart: unless-stopped

    logging:
      driver: "json-file"

      options:
        max-size: "10m"
        max-file: "3"


  minio:
    # Docker Hub no longer publishes minio/minio. This is the same upstream
    # release, republished as alpine/minio. Pin the tag; "latest" is absent.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z

    # The image runs as uid 100, which cannot write a new Docker volume.
    user: "0:0"

    # runtime injection: vars from .env become available inside container process env
    # .env file is required, otherwise deploy/compose run will fail
    env_file:
      - .env

    # MinIO reads its own names. Credentials come from S3_* so the same
    # .env works for Yandex/AWS later.
    # MINIO_SERVER_URL is the address the console process uses to call the
    # API. It must be reachable inside this container. S3_PUBLIC_URL is the
    # browser address (often a /s3 proxy on another host); pointing the
    # console at it makes login fail with 503.
    # MINIO_BROWSER_REDIRECT_URL stays a MinIO name: cloud S3 has no console.
    # `environment:` wins over `env_file`. `:?` fails the compose run if missing.
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      MINIO_SERVER_URL: http://127.0.0.1:9000
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:?MINIO_BROWSER_REDIRECT_URL is required}
      # Same region the backend signs with. Default is Yandex Moscow.
      MINIO_REGION_NAME: ${S3_REGION:-ru-central1}

    # 9000 stays on the Docker network. The backend calls it at
    # http://minio:9000, and Nginx publishes it as /s3/.
    # The console is bound to the host loopback only, so it is reachable
    # at http://127.0.0.1:9001 on this machine and through an SSH tunnel
    # (ssh -N -L 9001:127.0.0.1:9001 user@vps). It is not on the public IP.
    # MINIO_BROWSER_REDIRECT_URL must be that same URL, or the console
    # redirects the browser somewhere else.
    expose:
      - "9000"  # S3 API
    ports:
      - "127.0.0.1:9001:9001"  # Web console, localhost only

    volumes:
      - minio_data:/data  # named volume for host -> MinIO data dir in container

    command: server /data --console-address ":9001"

    healthcheck:
      # This image has wget and no mc. /minio/health/live returns 200 when the API is up.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3

    restart: unless-stopped

    logging:
      driver: "json-file"

      options:
        max-size: "10m"
        max-file: "3"


# Explicit top-level volume declaration for clarity and future flexibility.
# Compose can auto-create `postgres_data` from service mount syntax, but we keep
# it here so it is obvious this is an intentional named volume to persist DB data.
# This also makes it easy to later add options like `external`, `name`, or `driver`.
# `minio_data` persists MinIO objects (uploaded files) the same way.
volumes:
  postgres_data:
  minio_data:

# Host file secrets for image builds (not injected into running containers unless listed
# under a service's `secrets:`). `root_env` is used only by the frontend image build.
secrets:
  root_env:
    file: .env
