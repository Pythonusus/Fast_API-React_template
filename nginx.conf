server {
    # Listen on container port 8080.
    # This should match:
    # - Dockerfile EXPOSE
    # - docker-compose service port mapping
    # - any healthcheck URL that probes this app directly.
    listen 8080;

    # Hostname for virtual host matching.
    # In containerized deployments this is often not used for strict routing,
    # but keeping it explicit improves readability and future host-based setups.
    server_name localhost;

    # Directory that contains the built frontend files copied during image build.
    # The Dockerfile copies dist output to /usr/share/nginx/html.
    root /usr/share/nginx/html;

    # Default file to return for directory requests.
    # Example: request to "/" serves "/usr/share/nginx/html/index.html".
    index index.html;

    # Gzip is HTTP response compression.
    # Nginx compresses response bodies before sending them to the client.
    # Result:
    # - smaller payload size over the network
    # - faster page load on slower/latency-heavy connections
    # - less outbound bandwidth usage from the server
    # Tradeoff:
    # - a small amount of CPU is used to compress responses.
    # For text assets (HTML/CSS/JS/JSON), this tradeoff is usually worth it.
    #
    # "gzip on" enables this compression feature globally for this server block.
    gzip on;

    # Add "Vary: Accept-Encoding" response header.
    # Why:
    # - some clients support gzip, some do not
    # - caches (CDN/proxy/browser) must keep separate variants
    #   for compressed vs uncompressed content
    # Without this, a cache could serve the wrong variant.
    gzip_vary on;

    # Minimum response size (bytes) before gzip is applied.
    # Very small payloads often do not benefit from compression because
    # gzip metadata/CPU overhead can outweigh size savings.
    gzip_min_length 1024;

    # MIME types to compress.
    # These are mostly text-based formats that compress well.
    # Binary formats (images, videos, zip, etc.) are intentionally omitted because
    # they are already compressed or gain little from gzip.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Use zero-copy sendfile for efficient static file serving from disk.
    sendfile on;

    # Optimize packetization for large file sends when sendfile is enabled.
    # Helps reduce packet overhead for static assets.
    tcp_nopush on;

    # Hide exact Nginx version in error pages and headers.
    # This is a minor hardening step to reduce exposed implementation details.
    server_tokens off;

    # Clickjacking mitigation:
    # allows framing only by same origin pages.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME sniffing so browsers honor declared Content-Type.
    add_header X-Content-Type-Options "nosniff" always;

    # Legacy XSS filter header for older browsers.
    # Modern browsers largely ignore/deprecate this header, but it is harmless.
    add_header X-XSS-Protection "1; mode=block" always;

    # Baseline Content Security Policy (CSP):
    # - default to same-origin only
    # - disallow plugin/object embedding
    # - disallow third-party framing
    # - allow data: only for images/fonts commonly emitted by frontend build tools
    # If your app loads external APIs, fonts, analytics, or CDNs, extend the
    # relevant directives (connect-src, font-src, script-src, style-src, etc.).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'" always;

    location /assets/ {
        # Cache bundled frontend assets aggressively.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Reverse proxy API and backend endpoints to the backend container.
    # Regex notes:
    # - (api|...) defines allowed backend path prefixes.
    # - (?:/|$) ensures exact prefix matching boundaries.
    #   Without boundary checks, paths like /apiary could match unintentionally.
    # Also added some common backend endpoints created automatically by different tools.
    location ~ ^/(api|metrics|docs|redoc|openapi\.json)(?:/|$) {
        # Forward to backend service name on the Docker network.
        # No trailing slash means original request URI is preserved.
        proxy_pass http://backend:8080;

        # Use HTTP/1.1 for better keepalive/proxy behavior.
        proxy_http_version 1.1;

        # The headers below let the backend receive the original client request context
        # instead of only proxy-local Nginx values.
        # Preserve original host requested by the client.
        proxy_set_header Host $host;

        # Client IP from direct connection to Nginx.
        proxy_set_header X-Real-IP $remote_addr;

        # Preserve chain of client/proxy IPs across hops.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Inform backend about original request scheme (http/https).
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router SSG + CSR fallback:
    # - prerendered routes (/, /about) are served as static files
    # - unknown routes fall back to __spa-fallback.html for client-side routing
    location / {
        # Try exact file, then directory, then React Router SPA fallback.
        try_files $uri $uri/ /__spa-fallback.html;

        # Do not cache route HTML aggressively so new deployments are picked up.
        add_header Cache-Control "no-store" always;
    }

    # Block hidden files (e.g., .env, .git) if accidentally copied into web root.
    # This is a defense-in-depth safeguard.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
