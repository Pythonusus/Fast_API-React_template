repos:
  - repo: local
    hooks:
      - id: linter
        name: Run linter
        entry: make lint
        language: system
        types: [python]

      - id: tests
        name: Run tests
        entry: make test
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
